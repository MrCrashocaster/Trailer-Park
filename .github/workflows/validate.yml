name: Validate Godot prototype

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  simulation-and-multiplayer:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      GODOT_BIN: /tmp/godot/Godot_v4.7.2-stable_linux.x86_64
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Install pinned official Godot
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/godot
          curl --fail --location --retry 3 'https://downloads.godotengine.org/?version=4.7.2&flavor=stable&slug=linux.x86_64.zip' -o /tmp/godot/editor.zip
          printf '%s  %s\n' 'cadd3204e728a35d3f13adb7fd0d7902636b79f6b95c40c265eb73b6c35329e4' '/tmp/godot/editor.zip' | sha256sum --check
          unzip -q /tmp/godot/editor.zip -d /tmp/godot
          chmod +x "$GODOT_BIN"
          "$GODOT_BIN" --version
      - name: Import resources and validate scripts
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p test-results
          "$GODOT_BIN" --headless --path . --import 2>&1 | tee test-results/import.log
          python3 -c 'from pathlib import Path; data=Path("test-results/import.log").read_text(); assert not any(s in data for s in ("SCRIPT ERROR:", "Parse Error:", "Compile Error:")), data'
      - name: Test management simulation
        run: '"$GODOT_BIN" --headless --path . --script tests/test_simulation.gd'
      - name: Test world integration
        run: '"$GODOT_BIN" --headless --path . --scene tests/test_world.tscn'
      - name: Test touch HUD and management controls
        run: '"$GODOT_BIN" --headless --path . --script tests/test_hud.gd'
      - name: Test four-player ENet, reconnection and persistence
        run: python3 tools/test_network.py --report test-results/network.json
